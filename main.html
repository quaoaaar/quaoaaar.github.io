<head>

	<title></title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<style>

			justify-content: center;

		div.charContainer {
			display: grid;
			height: 100%;

		.grid {
			display: inline;
			float: left;

		div.char1 {
			width: 35%;
			/* height: 100%; */
		}

		div.char2 {

			/* height: 100%; */

			padding-top: 10%;
			width: 10%;
		}

		img {
			height: 600px;
			width: 600px;
			object-fit: contain;
			display: flex;
			justify-content: center;
			border-bottom: 3px groove black;
		}

		.card {
			visibility: hidden;
			box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19); /* having to care about css continues to evade me. thank you w3schools for just giving me a box shadow to use*/

		.card-body {
			height: "1000px";
		}

		@keyframes fade-in {
			0% 		{opacity: 0}
			100%	{opacity: 1}	
		}

		@keyframes fade-out {
			0%		{opacity: 1}
			100%	{opacity: 0}
		}
	</style>
</head>
<body>

	<div id="main">
		<div class="card char1 grid" onclick="guess(0)">
			<img src="*" alt="" class="card-img-top" id="charImg1">
			<div class="card-body">
				<h3 class="card-title" id="charName1"></h3>
				<h5 class="card-subtitle" id="charSeries1"></h5>
				<p id="charDesc1" class="charDesc"></p>
				<h6 class="card-text" id="charPower1"></h6>
			</div>
		</div>


		<div class="mid grid">
			<button class="input" onclick="newFight()" id="button">Generate 2 New Characters</button>

			<p id="highest-score"></p>

			<p id="streak">Score: 0</p>
		</div>


		<div class="card char2 grid">
			<img src="*" alt="" class="card-img-top" id="charImg2" onclick="guess(1)">
			<div class="card-body">
				<h3 class="card-title" id="charName2"></h3>
				<h5 class="card-subtitle" id="charSeries2"></h5>
				<p id="charDesc2" class="charDesc"></p>
				<h6 class="card-text" id="charPower2"></h6>
			</div>
		</div>
	</div>

	<script type="text/javascript">

		const charNameElement1 = document.getElementById("charName1");
		const charNameElement2 = document.getElementById("charName2");

		const charImgElement1 = document.getElementById("charImg1");
		const charImgElement2 = document.getElementById("charImg2");

		const charSeries1 = document.getElementById("charSeries1");
		const charSeries2 = document.getElementById("charSeries2");

		const charDesc1 = document.getElementById("charDesc1");
		const charDesc2 = document.getElementById("charDesc2");

		const charPower1 = document.getElementById("charPower1");
		const charPower2 = document.getElementById("charPower2");

		const cards = document.getElementsByClassName("card");

		const button = document.getElementById("button");

		const tiering = new Map([
			[]
		])

		var list = []; // Used as the list of characters

		var char1;
		var char2;

		var isPlaying = false;

		var streak = 0;
		var highscore = 0;
		var streakP = document.getElementById("streak");
		var highscoreP = document.getElementById("highest-score");

		var ready = false;

		window.onload = async function() { // load list on startup
			
			// const url = "https://sheetdb.io/api/v1/nosiqphdfjqxw";
			const url ="./character_list.json";

			try {
				const response = await fetch(url);
				if (!response.ok) {
					print("nay");
				}

				list = await response.json();
				// console.log(list);
				ready = true;
			} catch (error) {
				console.error(error.message)
			}
		}

		function getRandomInt(max) { // generate a random int
			return Math.floor(Math.random() * max);
		}
		
		function generateCharacter() { // generate a random character
			var num = getRandomInt(list.length - 0.01);
			var rawMap = new Map(Object.entries(list[num]));

			var charName = rawMap.get("Character Name");
			var charPower = rawMap.get("Power Level");
			var charStip = rawMap.get("PL Stipulation");
			var charImg = rawMap.get("Image");

			if (rawMap.get("Multiple Forms?") == "Yes") {
				// var lineCount = 0;
				var nameLineBreaks = [];
				var powLineBreaks = [];
				var stipLineBreaks = [];
				var imgLineBreaks = [];

				var looping = true;

				do { // note all the line locations
					var newLineName = charName.indexOf("|");

					if (newLineName != -1) { // I guarantee this is not very efficient vs manually adding the extra forms but i dont want to make more spreadsheet rows because thats l;ike 20 for goku 
						nameLineBreaks.push(newLineName); // writes down the break in names and then replaces it so it can check the next one
						charName = charName.replace("|", "`");

						powLineBreaks.push(charPower.indexOf("|"));
						charPower = charPower.replace("|", "`");

						stipLineBreaks.push(charStip.indexOf("|"));
						charStip = charStip.replace("|", "`");

						imgLineBreaks.push(charImg.indexOf("|"));
						charImg = charImg.replace("|", "`");
					} else {
						looping = false;
					}
				} while (looping)

				var variation = getRandomInt(nameLineBreaks.length + 0.99); // rolls on variation

				var newName = "";
				var newPower = "";
				var newImg = "";
				var newStip = "";

				// changes stuff in accordance with variation roll. its fucking ugly
				// there is no god, and yet i yearn for forgiveness
				if (variation == 0) {
					newName = charName.substring(0, nameLineBreaks[0] - 1);
					newPower = charPower.substring(0, powLineBreaks[0] - 1);
					newImg = charImg.substring(0, imgLineBreaks[0] - 1);
					newStip = charStip.substring(0, stipLineBreaks[0] - 1);
				} else if (variation == nameLineBreaks.length) {
					newName = charName.substring(nameLineBreaks[nameLineBreaks.length - 1] + 1, charName.length);
					newPower = charPower.substring(powLineBreaks[powLineBreaks.length - 1] + 1, charPower.length);
					newImg = charImg.substring(imgLineBreaks[imgLineBreaks.length - 1] + 1, charImg.length);
					newStip = charStip.substring(stipLineBreaks[stipLineBreaks.length - 1] + 1, charStip.length);
				}
				else {
					newName = charName.substring(nameLineBreaks[variation - 1] + 1, nameLineBreaks[variation] - 1);
					newPower = charName.substring(powLineBreaks[variation - 1] + 1, powLineBreaks[variation] - 1);
					newImg = charName.substring(imgLineBreaks[variation - 1] + 1, imgLineBreaks[variation] - 1);
					newStip = charName.substring(stipLineBreaks[variation - 1] + 1, stipLineBreaks[variation] - 1);
				}

				charName = newName.trim();
				charPower = newPower.trim();
				charImg = newImg.trim();
				charStip = newImg.trim();
			}

			charMedia = rawMap.get("Media");
			charSeries = rawMap.get("Series Name");

			// if (charMedia == "") { // pull media from a previous entry if its not set - lets me be lazy and get some form of categorisation in the spreadsheet
			// 	var looping = true;
			// 	do {
			// 		var loopCount = 0;
			// 		var lastMedia = new Map(Object.entries(list[num - loopCount])).get("Media");

			// 		if (lastMedia = "") {
			// 			loopCount++;
			// 		} else {
			// 			charMedia = lastMedia;
			// 			looping = false;
			// 		}
			// 	} while (looping);
			// }

			// if (charSeries == "") { // immm so smarts
			// 	var looping = true;
			// 	do {
			// 		var loopCount = 0;
			// 		var lastMedia = new Map(Object.entries(list[num - loopCount])).get("Series Name");

			// 		if (lastMedia = "") {
			// 			loopCount++;
			// 		} else {
			// 			charSeries = lastMedia;
			// 			looping = false;
			// 		}
			// 	} while (looping);
			// }

			// charDesc = rawMap.get("Blurb");

			return new Map([ // making a new map to hand back to the poor bastard that calls this function
				["num", num], //just in case i need it
				["name", charName],
				["power", charPower],
				["stipulation", charStip],
				["image", charImg],
				["media", charMedia],
				["series", charSeries], //atp theres no point in tracking if theres multiple forms since the variation has already been chosen
				["desc", rawMap.get("Blurb")]
			]);
		}

		function updateCards() {
			charNameElement1.innerHTML = char1.get("name");
			charNameElement2.innerHTML = char2.get("name");

			charImgElement1.src = char1.get("image");
			charImgElement2.src = char2.get("image");

			charSeries1.innerHTML = "From " + char1.get("series");
			charSeries2.innerHTML = "From " + char2.get("series");

			charDesc1.innerHTML = char1.get("desc");
			charDesc2.innerHTML = char2.get("desc");
		}

		function newFight() {
			if (!ready) return;

			if (document.querySelector(".card").style.visibility = "hidden") {
				document.querySelector(".char1").style.visibility = "visible";
				document.querySelector(".char2").style.visibility = "visible";
			}

			button.style.visibility = "hidden";

			isPlaying = true;

			charPower1.innerHTML = "";
			charPower2.innerHTML = "";

			char1 = generateCharacter();
			char2 = generateCharacter();
			
			// console.log(char1.get("name") + " vs " + char2.get("name"));

			updateCards();
		}

		function nextCharacter() {
			char1 = char2;
			char2 = generateCharacter();
			updateCards();

			charPower1.innerHTML = char1.get("power");
			charPower2.innerHTML = "";
		}

		function showPower() {
			charPower1.innerHTML = char1.get("power");
			charPower2.innerHTML = char2.get("power");
		}

		function win() {
			streak++;
			nextCharacter();
			streakP.innerHTML = "Score: " + streak;
		}

		function lose() {
			if (streak > highscore) {
				highscore = streak;
				highscoreP.innerHTML = "Best score: " + highscore;
			}
			streak = 0;
			streakP.innerHTML = "Score: 0";
			showPower();
			isPlaying = false;
			button.style.visibility = "visible";
			button.innerHTML = "Restart";
		}

		function guess(charChoice) {
			if (!isPlaying || charChoice > 1) {
				return
			}

			var charray = [char1, char2];
			var letterHierarchy= ["C-", "C", "C+", "B-", "B", "B+", "A-", "A", "A+"];

			var friend = charray[charChoice];
			var enemy = charray[1 - charChoice];

			// console.log("voted for "  + friend.get("name") + ", enemy of " + enemy.get("name"));
			// compare power levels

			var friendPL = friend.get("power");
			var enemyPL = enemy.get("power");

			// console.log(friendPL);
			// console.log(enemyPL);

			if (parseInt(friendPL.substring(0, friendPL.indexOf("-"))) <= parseInt(enemyPL.substring(0, enemyPL.indexOf("-")))) { // my ugly ass comparative ifs. checks numbers
				// should have been an else if but oh well
				if (parseInt(friendPL.substring(0, friendPL.indexOf("-"))) == parseInt(enemyPL.substring(0, enemyPL.indexOf("-")))) {
					// checks letter if theyre the same number. array will return higher index number if the letter places higher in the chart
					if (letterHierarchy.indexOf(friendPL.substring(friendPL.indexOf("-") + 1, friendPL.length)) >= letterHierarchy.indexOf(enemyPL.substring(enemyPL.indexOf("-") + 1, enemyPL.length))) {
						win();
					} else {
						lose();
					}
				} else {
					win();
				}
			} else {
				lose();
			}
		}
	</script>
</body>
